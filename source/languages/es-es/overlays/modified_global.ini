Adagio_Industrial_Component_Salvage_Levski_H_Desc_001=Adagio Holdings\nUn orgulloso empleador que ofrece igualdad de oportunidades\n\n> Sobre el trabajo <\nPara ayudar a satisfacer un pedido especial reciente, buscamos contratistas que nos ayuden a conseguir Recycled Material Composite (RMC), materiales de construccion sin refinar (escombros, piezas o salvamento) y componentes, desguazando y fracturando naves abandonadas y retirando a mano las piezas solicitadas con un <EM4>rayo tractor</EM4>.\n\nRecomendamos buscar restos en puntos de Lagrange, tal vez en alguno de los cinturones de asteroides de Nyx, o comprar una reclamacion de salvamento en el Administrador de contratos. Recomendamos extremar la precaucion, ya que ha habido avistamientos vanduul en el sistema, sobre todo por lo que puede llevar localizar este pedido concreto.\n\nUna vez obtenidos, entrega los materiales en el elevador de carga situado en <EM4>~mission(Destination|Address)</EM4>.\n\nPara obtener consejos sobre salvamento, consulta <EM4>A Salvager's Guide to Material Collection</EM4> en el diario de tu mobiGlas.\n\n> Requisitos <\n     - Cualquier clase o tamaño de nave de salvamento\n     - Un rayo tractor de mano\n\n> Descargo de responsabilidad <\nLos contratistas son responsables de garantizar que recogen materiales de vehiculos considerados salvamento legitimo conforme a las leyes vigentes de la UEE. Adagio Holdings no sera responsable de ningun delito o falta cometido por los contratistas y no ofrecera compensacion ni reparacion a ninguna persona afectada por estas acciones.\n\n<EM4>Reputation Awarded:</EM4> 150\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Contratista</EM4>\n- Trawler Scraper Module (Modulo de salvamento)\n- Abrade Scraper Module (Modulo de salvamento)\n- Cinch Scraper Module (Modulo de salvamento)\n
