TheCollector_Recipes_Desc_VGLflightsuit=Las naves tienen ventanas grandes. Todo el mundo puede verte pilotando. Deberias tener el mejor aspecto. Wikelo tiene un muy buen traje de vuelo para ti. Haz el intercambio, traeme lo que necesito y Wikelo te dara el traje. Tambien te dara el plano si no lo tienes.\n\n<EM4>Reputation Awarded:</EM4> 10\n<EM4>Varios grupos de planos</EM4>\n<EM4>Grupo 1</EM4>\n- Tailwind Flight Suit Dominion Camo\n\n<EM4>Grupo 2</EM4>\n- Tailwind Flight Helmet Dominion Camo\n
TheCollector_Recipes_Desc_NoneAR=Este rifle dispara muy bien, pero podria tener mejor diseño. Wikelo lo arregla. Ahora tiene muy buen aspecto. Te lo dara en intercambio. Traeme cosas y yo te doy el rifle. Incluso te dare el plano si lo necesitas.\n\n<EM4>Reputation Awarded:</EM4> 10\n\n<EM4>Posibles planos</EM4>\n- Killshot "Dominion Camo" Rifle\n
TheCollector_Recipes_Desc_L22Wolf=Wikelo esta muy emocionado. Tiene una idea para un material nuevo. Pero fabricarlo es de lo mas complicado. Muy complicado. Necesita ayuda para fabricar una muestra de prueba. Yo te doy el plano, tu lo fabricas, me lo traes y yo hago el intercambio. Te dare un L-22 Wolf extraespecial. Muy potente, muy lobo.\n\n<EM4>Posibles planos</EM4>\n- Metamaterial Test #146\n
Covalex_HaulCargo_AtoB_desc_ToRuinStation=Hola,\n\nBuscamos un transportista dispuesto a hacer un viaje a Ruin Station. Se que los transportes a Pyro pueden hacer dudar a algunas personas, pero este es uno que hacemos regularmente para ayudar a abastecer la estacion. Tambien he confirmado que todo en el manifiesto de carga esta en regla.\n\nSi estas interesado, la carga esta lista para recogerse en <EM4>~mission(Location|Address)</EM4>. Asegurate de traer un <EM4>rayo tractor de mano</EM4> y una nave que pueda transportar <EM4>contenedores de carga de ~mission(MissionMaxSCUSize)</EM4> o podria complicarse un poco.\n\n~mission(Contractor|SignOff)\n\nElla Tieno\nCoordinadora Jr. de Logistica\nCovalex Shipping\n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping es una sociedad de responsabilidad limitada. Para fomentar las entregas puntuales y prevenir fraudes en transportes de carga, Covalex Shipping establecera un limite de tiempo de entrega y, tras su expiracion, cualquier carga no entregada sera considerada robada y tratada como tal. El pago total se prorrateara segun el porcentaje de carga entregado correctamente.\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Maestro</EM4>\n- VK-00 (Motor cuantico)\n- Siren (Motor cuantico)\n- XL-1 (Motor cuantico)\n- Yeager (Motor cuantico)\n- Balandin (Motor cuantico)\n- TS-2 (Motor cuantico)\n- Palisade (Escudo)\n- Rampart (Escudo)\n- Parapet (Escudo)\n
Covalex_HaulCargo_AtoB_desc_ToLevski=Hola,\n\nHay un monton de carga en <EM4>~mission(Location|Address)</EM4> que necesita ser movida a Levski. La People's Alliance tiene un pedido permanente de estas cosas porque las necesitan desesperadamente, pero no es facil conseguirlas en Nyx. Tiene gracia que no quieran formar parte de la UEE y aun asi dependan de nosotros para sobrevivir.\n\nDe todos modos, necesitaras un <EM4>rayo tractor de mano</EM4> y una nave que pueda transportar <EM4>contenedores de carga de ~mission(MissionMaxSCUSize)</EM4> para completar este encargo.\n\n~mission(Contractor|SignOff)\n\nElla Tieno\nCoordinadora Jr. de Logistica\nCovalex Shipping\n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping es una sociedad de responsabilidad limitada. Para fomentar las entregas puntuales y prevenir fraudes en transportes de carga, Covalex Shipping establecera un limite de tiempo de entrega y, tras su expiracion, cualquier carga no entregada sera considerada robada y tratada como tal. El pago total se prorrateara segun el porcentaje de carga entregado correctamente.\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Maestro</EM4>\n- VK-00 (Motor cuantico)\n- Siren (Motor cuantico)\n- XL-1 (Motor cuantico)\n- Yeager (Motor cuantico)\n- Balandin (Motor cuantico)\n- TS-2 (Motor cuantico)\n- Palisade (Escudo)\n- Rampart (Escudo)\n- Parapet (Escudo)\n
Covalex_HaulCargo_AtoB_desc_FromLevski=Hola,\n\nLa People's Alliance nos contrato para mover un cargamento desde Levski hasta <EM4>~mission(Destination|Address)</EM4>. Sinceramente, me sorprende que exporten algunas de estas cosas, pero supongo que tienen que vender algo para poder pagar todo lo que importan.\n\nPara el viaje en si, necesitaras una nave que pueda transportar <EM4>contenedores de carga de ~mission(MissionMaxSCUSize)</EM4> y un <EM4>rayo tractor de mano</EM4> para manejar los contenedores. Eso deberia ser todo.\n\n~mission(Contractor|SignOff)\n\nElla Tieno\nCoordinadora Jr. de Logistica\nCovalex Shipping\n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping es una sociedad de responsabilidad limitada. Para fomentar las entregas puntuales y prevenir fraudes en transportes de carga, Covalex Shipping establecera un limite de tiempo de entrega y, tras su expiracion, cualquier carga no entregada sera considerada robada y tratada como tal. El pago total se prorrateara segun el porcentaje de carga entregado correctamente.\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Maestro</EM4>\n- VK-00 (Motor cuantico)\n- Siren (Motor cuantico)\n- XL-1 (Motor cuantico)\n- Yeager (Motor cuantico)\n- Balandin (Motor cuantico)\n- TS-2 (Motor cuantico)\n- Palisade (Escudo)\n- Rampart (Escudo)\n- Parapet (Escudo)\n
Covalex_HaulCargo_AtoB_desc_FromRuinStation=Hola, soy El.\n\nTengo un cliente en <EM4>~mission(Location|Address)</EM4> que necesita que recojan su carga en Ruin Station. Llevan un tiempo esperando alli y empiezan a impacientarse. ¿Podrias encargarte de esto por nosotros?\n\nNecesitaras una nave que pueda transportar <EM4>contenedores de carga de ~mission(MissionMaxSCUSize)</EM4> y un <EM4>rayo tractor de mano</EM4> para poder moverlos.\n\n~mission(Contractor|SignOff)\n\nElla Tieno\nCoordinadora Jr. de Logistica\nCovalex Shipping\n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping es una sociedad de responsabilidad limitada. Para fomentar las entregas puntuales y prevenir fraudes en transportes de carga, Covalex Shipping establecera un limite de tiempo de entrega y, tras su expiracion, cualquier carga no entregada sera considerada robada y tratada como tal. El pago total se prorrateara segun el porcentaje de carga entregado correctamente.\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Maestro</EM4>\n- VK-00 (Motor cuantico)\n- Siren (Motor cuantico)\n- XL-1 (Motor cuantico)\n- Yeager (Motor cuantico)\n- Balandin (Motor cuantico)\n- TS-2 (Motor cuantico)\n- Palisade (Escudo)\n- Rampart (Escudo)\n- Parapet (Escudo)\n
Covalex_HaulCargo_SingleToMulti_desc_ToCFP_Danger=Hola,\n\nVarios puestos de Citizens for Prosperity en Pyro necesitan suministros. Parece que hacemos viajes como este con regularidad para ellos, pero este diria que puede ser algo mas arriesgado. Un representante de CFP me aviso de que la actividad forajida alrededor de estos lugares ha aumentado recientemente, pero necesitan desesperadamente reabastecer los puestos, asi que seguiremos adelante con la entrega. <EM4>Solo un aviso: podrias encontrarte con problemas, asi que ven preparado</EM4>.\n\nToda la carga esta esperando en <EM4>~mission(Location|Address)</EM4> y aqui tienes el destino:\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n\n~mission(SingleToMultiToken)\n\nSegun el manifiesto, el contenedor de carga mas grande con el que tendras que lidiar es de <EM4>~mission(MissionMaxSCUSize)</EM4>. Aparte de eso, recuerda traer un <EM4>rayo tractor de mano</EM4>.\n\n~mission(Contractor|SignOff)\n\nElla Tieno\nCoordinadora Jr. de Logistica\nCovalex Shipping\n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping es una sociedad de responsabilidad limitada. Para fomentar las entregas puntuales y prevenir fraudes en transportes de carga, Covalex Shipping establecera un limite de tiempo de entrega y, tras su expiracion, cualquier carga no entregada sera considerada robada y tratada como tal. El pago total se prorrateara segun el porcentaje de carga entregado correctamente.\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Maestro</EM4>\n- VK-00 (Motor cuantico)\n- Siren (Motor cuantico)\n- XL-1 (Motor cuantico)\n- Yeager (Motor cuantico)\n- Balandin (Motor cuantico)\n- TS-2 (Motor cuantico)\n- Palisade (Escudo)\n- Rampart (Escudo)\n- Parapet (Escudo)\n
Covalex_HaulCargo_SingleToMulti_desc_Valakkar_Timed=Hola,\n\nNuestro cliente abatió a un Valakkar y lo proceso en materia organica. Ya tiene compradores esperando la mercancia en varios lugares, asi que necesito a alguien que vaya a <EM4>~mission(Location|Address)</EM4>, lo recoja todo y luego lo entregue en los siguientes puntos:\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n\n~mission(SingleToMultiToken)\n\nSegun el manifiesto, el contenedor de carga mas grande con el que tendras que lidiar es de <EM4>~mission(MissionMaxSCUSize)</EM4>. No olvides traer tu <EM4>rayo tractor de mano</EM4>. No se muy bien como moverias esto sin el.\n\n~mission(Contractor|SignOff)\n\nElla Tieno\nCoordinadora Jr. de Logistica\nCovalex Shipping\n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping es una sociedad de responsabilidad limitada. Para fomentar las entregas puntuales y prevenir fraudes en transportes de carga, Covalex Shipping establecera un limite de tiempo de entrega y, tras su expiracion, cualquier carga no entregada sera considerada robada y tratada como tal. El pago total se prorrateara segun el porcentaje de carga entregado correctamente.\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Maestro</EM4>\n- VK-00 (Motor cuantico)\n- Siren (Motor cuantico)\n- XL-1 (Motor cuantico)\n- Yeager (Motor cuantico)\n- Balandin (Motor cuantico)\n- TS-2 (Motor cuantico)\n- Palisade (Escudo)\n- Rampart (Escudo)\n- Parapet (Escudo)\n
Covalex_HaulCargo_AtoB_desc_DeliverAll=Hola,\n\nTe explico: necesito a alguien competente para un viaje especial. Tenemos a un cliente importante que amenaza con llevarse su negocio a otra parte porque en sus entregas siempre falta carga. Exige que en este viaje se entregue el 100% de la mercancia o no pagara. Como esto venia de antes de que yo llegara y mi supervisor quiere demostrar que no volvera a pasar, aceptaron. En fin, creo que podrias encajar bien.\n\nSi estas dispuesto a asumir ese riesgo, aqui tienes todos los detalles. La carga puede recogerse en <EM4>~mission(Location|Address)</EM4> y entregarse en <EM4>~mission(Destination|Address)</EM4>. Parece que el contenedor de carga mas grande que tendras que manejar es de <EM4>~mission(MissionMaxSCUSize)</EM4>, asi que asegurate de traer una nave lo bastante grande y un <EM4>rayo tractor de mano</EM4> para ayudarte a mover esos contenedores.\n\n~mission(Contractor|SignOff)\n\nElla Tieno\nCoordinadora Jr. de Logistica\nCovalex Shipping\n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping es una sociedad de responsabilidad limitada. Para fomentar las entregas puntuales y prevenir fraudes en transportes de carga, Covalex Shipping establecera un limite de tiempo de entrega y, tras su expiracion, cualquier carga no entregada sera considerada robada y tratada como tal. El pago total se prorrateara segun el porcentaje de carga entregado correctamente.\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Maestro</EM4>\n- VK-00 (Motor cuantico)\n- Siren (Motor cuantico)\n- XL-1 (Motor cuantico)\n- Yeager (Motor cuantico)\n- Balandin (Motor cuantico)\n- TS-2 (Motor cuantico)\n- Palisade (Escudo)\n- Rampart (Escudo)\n- Parapet (Escudo)\n
FTL_Courier_Stanton_Easy_Desc_001=CONTRATO FTL DISPONIBLE\nPARA ASIGNACION INMEDIATA\n\n**DETALLES DEL CONTRATO**\nSe necesita un mensajero fiable y trabajador de nivel inicial para transportar una entrega en Stanton.\nSeras responsable de poner tu propio transporte.\nLos contratistas interesados deben tener la <EM4>capacidad de levantar cajas de hasta .25 SCU</EM4>.\nLos contratistas trabajan por cuenta propia y, por tanto, no estan cubiertos por el seguro de empresa de FTL.\n\n~mission(Contractor|SignOff)\n\n<EM4>Reputation Awarded (by difficulty):</EM4> 100 / 500\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Neutral</EM4>\n- Colossus (Motor cuantico)\n- Huracan (Motor cuantico)\n- Agni (Motor cuantico)\n- Defiant (Planta de energia)\n- Endurance (Planta de energia)\n- Sedulity (Planta de energia)\n
FTL_Courier_Nyx_Easy_Desc_001=CONTRATO FTL DISPONIBLE\nPARA ASIGNACION INMEDIATA\n\n**DETALLES DEL CONTRATO**\nFTL necesita un mensajero de nivel inicial para completar entregas en Nyx.\nEl mensajero debe poner su propio transporte.\nSe valora experiencia previa en levantamiento manual, con la <EM4>capacidad de mover cajas de hasta .25 SCU</EM4>.\nAl aceptar este contrato, aceptas asumir toda la responsabilidad por la seguridad de los paquetes asignados.\n\n~mission(Contractor|SignOff)\n\n<EM4>Reputation Awarded:</EM4> 100\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Neutral</EM4>\n- Colossus (Motor cuantico)\n- Huracan (Motor cuantico)\n- Agni (Motor cuantico)\n- Defiant (Planta de energia)\n- Endurance (Planta de energia)\n- Sedulity (Planta de energia)\n
UWC_Refueling_easy_desc_001=Hola.\n\nSi tu nave esta preparada para repostar, puede que esto te interese.\n\nAcaba de activarse una baliza en <EM4>~mission(Location|Address)</EM4>, de un cliente cuya <EM4>~mission(Ship)</EM4> se ha quedado sin combustible, asi que asegurate de llevar llenos tus pods de combustible.\n\nLa nave cliente te pagara a razon de <EM4>~mission(FuelRate) aUEC por SCU de Hydrogen</EM4> y <EM4>~mission(QTFuelRate) aUEC por SCU de Quantum </EM4>, y como contratista del United Wayfarers Club tambien recibiras la tasa de servicio de la UWC indicada arriba al completar el trabajo.\n\nParece uno de esos encargos sencillos y sin drama, pero nunca esta de mas llevar los escaneres activos.\nDime si te interesa y pongamos a esta buena gente de nuevo en marcha.\n\nQuedo a la espera.\n\nDina Deloit\nCentro de despacho\nUnited Wayfarers Club\n"We've got your back"\n\n<EM4>Reputation Awarded (by difficulty):</EM4> 100 / 200\n\n<EM4>Posibles planos</EM4>\n- bp_craft_nozzle_fuelgiver_grin_nozzlefast (Boquilla de combustible)\n- Marlin (Boquilla de combustible)\n- Lindstrom (Boquilla de combustible)\n- bp_craft_nozzle_fuelgiver_grin_nozzleverysecure (Boquilla de combustible)\n- bp_craft_nozzle_fuelgiver_misc_nozzlestandard (Boquilla de combustible)\n- Bendix (Boquilla de combustible)\n- Torrez (Boquilla de combustible)\n- Ezra (Boquilla de combustible)\n
UWC_Refueling_moderate_desc_001=Hola, tu.\n\nTengo una baliza en <EM4>~mission(Location|Address)</EM4>. Dicen que tienen los depositos secos y que necesitan un repostaje completo. Si te interesa, me da que se van a alegrar mucho de verte.\n\nLa nave cliente te pagara a razon de <EM4>~mission(FuelRate) aUEC por SCU de Hydrogen</EM4> y <EM4>~mission(QTFuelRate) aUEC por SCU de Quantum </EM4>, y como contratista del United Wayfarers Club tambien recibiras la tasa de servicio de la UWC indicada arriba al completar el trabajo.\n\nEstan tirados en una zona con mala fama, aunque ultimamente parece que la cosa se ha calmado un poco. Aun asi, yo seguiria atenta, por si acaso sigue habiendo problemas al acecho.\n\nEn cualquier caso, cuanto antes puedan volver todos a volar, y eso te incluye a ti, mejor.\n\nBuen camino.\n\nDina Deloit\nCentro de despacho\nUnited Wayfarers Club\n"We've got your back"\n\n<EM4>Reputation Awarded:</EM4> 150\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Contratista junior</EM4>\n- bp_craft_nozzle_fuelgiver_grin_nozzlefast (Boquilla de combustible)\n- Marlin (Boquilla de combustible)\n- Lindstrom (Boquilla de combustible)\n- bp_craft_nozzle_fuelgiver_grin_nozzleverysecure (Boquilla de combustible)\n- bp_craft_nozzle_fuelgiver_misc_nozzlestandard (Boquilla de combustible)\n- Bendix (Boquilla de combustible)\n- Torrez (Boquilla de combustible)\n- Ezra (Boquilla de combustible)\n
UWC_Refueling_multiple_med_desc_001=Hola de nuevo.\n\nTengo una baliza en <EM4>~mission(Location|Address)</EM4> y esta vez es gorda. Toda una pequeña flota se ha quedado sin combustible al mismo tiempo. Una coordinacion impresionante y una falta total de planificacion, todo a la vez.\n\nLa nave cliente te pagara a razon de <EM4>~mission(FuelRate) aUEC por SCU de Hydrogen</EM4> y <EM4>~mission(QTFuelRate) aUEC por SCU de Quantum </EM4>, y como contratista del United Wayfarers Club tambien recibiras la tasa de servicio de la UWC indicada arriba al completar el trabajo.\n\nCon suerte, como la zona en la que estan es bastante segura, no deberia haber demasiados problemas al acecho, pero hoy en dia nunca se sabe. No estaria de mas devolverlos al aire tan rapido como puedas.\n\nBuen camino.\n\nDina Deloit\nCentro de despacho\nUnited Wayfarers Club\n"We've got your back"\n\n<EM4>Reputation Awarded (by difficulty):</EM4> 50 / 150 / 200\n\n<EM4>Posibles planos</EM4>\n- bp_craft_nozzle_fuelgiver_grin_nozzlefast (Boquilla de combustible)\n- Marlin (Boquilla de combustible)\n- Lindstrom (Boquilla de combustible)\n- bp_craft_nozzle_fuelgiver_grin_nozzleverysecure (Boquilla de combustible)\n- bp_craft_nozzle_fuelgiver_misc_nozzlestandard (Boquilla de combustible)\n- Bendix (Boquilla de combustible)\n- Torrez (Boquilla de combustible)\n- Ezra (Boquilla de combustible)\n
UWC_Refueling_high_desc_001=Hola.\n\nOtro dia, otra baliza. Hay una <EM4>~mission(Ship)</EM4> con el deposito vacio en <EM4>~mission(Location|Address)</EM4>. La nave cliente te pagara a razon de <EM4>~mission(FuelRate) aUEC por SCU de Hydrogen</EM4> y <EM4>~mission(QTFuelRate) aUEC por SCU de Quantum </EM4>, y como contratista del United Wayfarers Club tambien recibiras la tasa de servicio de la UWC indicada arriba al completar el trabajo.\n\nNo te voy a engañar: es un sitio horrible para quedarse tirado y peor aun para que te pillen por sorpresa. Hemos perdido a buena gente ahi fuera; incluso los que tuvieron suerte volvieron a casa hechos pedazos.\n\nSi decides aceptar el trabajo, hazme el favor de ir con mil ojos. Si tienes un colega con algo de tiempo libre, quiza te convenga pedir un poco de apoyo.\n\nPuede que este siendo paranoica, pero eso no significa que no vayan a por ti, como decia Mama Deloit.\nEn realidad nunca dijo eso, pero estoy bastante segura de que lo diria si se dedicara a esto.\n\nHaz el trabajo y vuelve a casa de una pieza, ¿vale?\n\nDina Deloit\nCentro de despacho\nUnited Wayfarers Club\n"We've got your back"\n\n<EM4>Reputation Awarded:</EM4> 200\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Contratista senior</EM4>\n- bp_craft_nozzle_fuelgiver_grin_nozzlefast (Boquilla de combustible)\n- Marlin (Boquilla de combustible)\n- Lindstrom (Boquilla de combustible)\n- bp_craft_nozzle_fuelgiver_grin_nozzleverysecure (Boquilla de combustible)\n- bp_craft_nozzle_fuelgiver_misc_nozzlestandard (Boquilla de combustible)\n- Bendix (Boquilla de combustible)\n- Torrez (Boquilla de combustible)\n- Ezra (Boquilla de combustible)\n
Shubin_Industrial_ShipMining_Stanton_S_Secondary_Desc_001=AVISO: Orden de Compra\nLOCALIZACION: <EM4>~mission(System) </EM4>\n\nCONDICIONES*: \nShubin Interstellar actualmente busca completar otro pedido de una variedad de materiales refinados. Agradecemos tu ayuda en este asunto.\n\n~mission(Hint_Location) Muchos de estos minerales son extremadamente raros y dificiles de encontrar, detectables solo cuando una roca ha sido fracturada.\n\nRecuerda que todos los <EM4>materiales deben refinarse antes de la entrega</EM4> y, dado que esto es una orden de compra y no un contrato minero, se espera que aportes tu propio equipo, como un <EM4>~mission(Hint_Tool)</EM4>.\n\nCuando estes listo para vendernos los materiales refinados requeridos, depositalos en el elevador de carga situado en <EM4>~mission(Destination|Address)</EM4>.\n\n\n<EM4>Reputation Awarded (by difficulty):</EM4> 50 / 200\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Contratista principal</EM4>\n<EM4>[Variantes regionales] ubicaciones de ejemplo: Stanton, Pyro</EM4>\n- Arclight "Stormfall" Pistol\n- Arclight Pistol\n- Venture Arms Base\n- Venture Core Base\n- Venture Legs Base\n- Horizon Helmet Base\n- Arclight Pistol Battery (30 cap)\n\n<EM4>[Variantes regionales] ubicaciones de ejemplo: Crusader, microTech, Nyx</EM4>\n- Arclight "Nightstalker" Pistol\n- Aril Arms\n- Aril Core\n- Aril Legs\n- Aril Helmet\n- Arclight "Warhawk" Pistol\n- Arclight Pistol Battery (30 cap)\n\n<EM4>[Variantes regionales] ubicaciones de ejemplo: Stanton System, Crusader, microTech</EM4>\n- Arbor MHV Mining Laser (Laser minero)\n- S00 Hofstede (Laser minero)\n- Lawson Mining Laser (Laser minero)\n- S0 Helix (Laser minero)\n- Surveyor-Go (Radar)\n- Surveyor-Lite (Radar)\n- Surveyor (Radar)\n- Surveyor-Max (Radar)\n\n<EM4>[Variantes regionales] ubicaciones de ejemplo: Stanton System, Nyx, ArcCorp</EM4>\n- Pitman Mining Laser (Laser minero)\n- Hofstede-S1 Mining Laser (Laser minero)\n- Klein-S1 Mining Laser (Laser minero)\n- Helix I Mining Laser (Laser minero)\n- Impact I Mining Laser (Laser minero)\n- Arbor MH1 Mining Laser (Laser minero)\n- Lancet MH1 Mining Laser (Laser minero)\n- BroadSpec-Go (Radar)\n- BroadSpec (Radar)\n- BroadSpec-Max (Radar)\n\n<EM4>[Variantes regionales] ubicaciones de ejemplo: Stanton System, Hurston, Nyx</EM4>\n- Arbor MH2 Mining Laser (Laser minero)\n- Lancet MH2 Mining Laser (Laser minero)\n- Hofstede-S2 Mining Laser (Laser minero)\n- Klein-S2 Mining Laser (Laser minero)\n- Helix II Mining Laser (Laser minero)\n- Impact II Mining Laser (Laser minero)\n- FullSpec-Go (Radar)\n- FullSpec (Radar)\n- FullSpec-Max (Radar)\n
