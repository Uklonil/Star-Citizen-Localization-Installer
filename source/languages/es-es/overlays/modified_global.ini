Adagio_Industrial_Component_Salvage_Universal_M_Desc_001=Adagio Holdings\nUn orgulloso empleador que ofrece igualdad de oportunidades\n\n> Sobre el trabajo <\nPara ayudar a satisfacer un pedido reciente, buscamos contratistas que nos ayuden a conseguir Recycled Material Composite (RMC), materiales de construccion sin refinar (escombros, piezas o salvamento) y componentes, desguazando y fracturando naves abandonadas y retirando a mano las piezas solicitadas con un <EM4>rayo tractor</EM4>. Recomendamos buscar restos en puntos de Lagrange o, si lo prefieres, comprar una reclamacion de salvamento en el Administrador de contratos.\n\nUna vez obtenidos, entrega los materiales en el elevador de carga situado en <EM4>~mission(Destination|Address)</EM4>.\n\nPara obtener consejos sobre salvamento, consulta <EM4>A Salvager's Guide to Material Collection</EM4> en el diario de tu mobiGlas.\n\n> Requisitos <\n     - Cualquier clase o tamaño de nave de salvamento\n     - Un rayo tractor de mano\n\n> Descargo de responsabilidad <\nLos contratistas son responsables de garantizar que recogen materiales de vehiculos considerados salvamento legitimo conforme a las leyes vigentes de la UEE. Adagio Holdings no sera responsable de ningun delito o falta cometido por los contratistas y no ofrecera compensacion ni reparacion a ninguna persona afectada por estas acciones.\n\n<EM4>Reputation Awarded:</EM4> 100\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Contratista junior</EM4>\n- Trawler Scraper Module (Modulo de salvamento)\n- Abrade Scraper Module (Modulo de salvamento)\n- Cinch Scraper Module (Modulo de salvamento)\n
Adagio_Industrial_Component_Salvage_Stanton_M_Desc_001=Adagio Holdings\nUn orgulloso empleador que ofrece igualdad de oportunidades\n\n> Sobre el trabajo <\nPara ayudar a satisfacer un pedido especial reciente, buscamos contratistas que nos ayuden a conseguir Recycled Material Composite (RMC), materiales de construccion sin refinar (escombros, piezas o salvamento) y componentes, desguazando y fracturando naves abandonadas y retirando a mano las piezas solicitadas con un <EM4>rayo tractor</EM4>.\n\nRecomendamos buscar restos en puntos de Lagrange o, si lo prefieres, comprar una reclamacion de salvamento en el Administrador de contratos. Este pedido seguramente no sera tan facil de completar como nuestros contratos normales, incluso con la cantidad de naves que cruzan un sistema tan poblado como Stanton, asi que no te sorprendas si tienes que dedicar algo mas de esfuerzo a encontrar lo necesario.\n\nUna vez obtenidos, entrega los materiales en el elevador de carga situado en <EM4>~mission(Destination|Address)</EM4>.\n\nPara obtener consejos sobre salvamento, consulta <EM4>A Salvager's Guide to Material Collection</EM4> en el diario de tu mobiGlas.\n\n> Requisitos <\n     - Cualquier clase o tamaño de nave de salvamento\n     - Un rayo tractor de mano\n\n> Descargo de responsabilidad <\nLos contratistas son responsables de garantizar que recogen materiales de vehiculos considerados salvamento legitimo conforme a las leyes vigentes de la UEE. Adagio Holdings no sera responsable de ningun delito o falta cometido por los contratistas y no ofrecera compensacion ni reparacion a ninguna persona afectada por estas acciones.\n\n<EM4>Reputation Awarded:</EM4> 100\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Contratista junior</EM4>\n- Trawler Scraper Module (Modulo de salvamento)\n- Abrade Scraper Module (Modulo de salvamento)\n- Cinch Scraper Module (Modulo de salvamento)\n
Adagio_Industrial_Component_Salvage_Pyro_M_Desc_001=Adagio Holdings\nUn orgulloso empleador que ofrece igualdad de oportunidades\n\n> Sobre el trabajo <\nPara ayudar a satisfacer un pedido especial reciente, buscamos contratistas que nos ayuden a conseguir Recycled Material Composite (RMC), materiales de construccion sin refinar (escombros, piezas o salvamento) y componentes, desguazando y fracturando naves abandonadas y retirando a mano las piezas solicitadas con un <EM4>rayo tractor</EM4>.\n\nRecomendamos buscar restos en puntos de Lagrange o, si lo prefieres, comprar una reclamacion de salvamento en el Administrador de contratos. Este pedido seguramente no sera tan facil de completar como nuestros contratos normales, en parte por la cantidad de forajidos que vuelan por Pyro y en parte porque este pedido no es precisamente para un componente cualquiera. Pero, por suerte para ti, el esfuerzo extra se vera recompensado.\n\nUna vez obtenidos, entrega los materiales en el elevador de carga situado en <EM4>~mission(Destination|Address)</EM4>.\n\nPara obtener consejos sobre salvamento, consulta <EM4>A Salvager's Guide to Material Collection</EM4> en el diario de tu mobiGlas.\n\n> Requisitos <\n     - Cualquier clase o tamaño de nave de salvamento\n     - Un rayo tractor de mano\n\n> Descargo de responsabilidad <\nLos contratistas son responsables de garantizar que recogen materiales de vehiculos considerados salvamento legitimo conforme a las leyes vigentes de la UEE. Adagio Holdings no sera responsable de ningun delito o falta cometido por los contratistas y no ofrecera compensacion ni reparacion a ninguna persona afectada por estas acciones.\n\n<EM4>Reputation Awarded:</EM4> 100\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Contratista junior</EM4>\n- Trawler Scraper Module (Modulo de salvamento)\n- Abrade Scraper Module (Modulo de salvamento)\n- Cinch Scraper Module (Modulo de salvamento)\n
Adagio_Industrial_Component_Salvage_Levski_M_Desc_001=Adagio Holdings\nUn orgulloso empleador que ofrece igualdad de oportunidades\n\n> Sobre el trabajo <\nPara ayudar a satisfacer un pedido especial reciente, buscamos contratistas que nos ayuden a conseguir Recycled Material Composite (RMC), materiales de construccion sin refinar (escombros, piezas o salvamento) y componentes, desguazando y fracturando naves abandonadas y retirando a mano las piezas solicitadas con un <EM4>rayo tractor</EM4>.\n\nRecomendamos buscar restos en puntos de Lagrange, tal vez en alguno de los cinturones de asteroides de Nyx, o comprar una reclamacion de salvamento en el Administrador de contratos. Recomendamos extremar la precaucion, ya que ha habido avistamientos vanduul en el sistema, sobre todo por lo que puede llevar localizar este pedido concreto.\n\nUna vez obtenidos, entrega los materiales en el elevador de carga situado en <EM4>~mission(Destination|Address)</EM4>.\n\nPara obtener consejos sobre salvamento, consulta <EM4>A Salvager's Guide to Material Collection</EM4> en el diario de tu mobiGlas.\n\n> Requisitos <\n     - Cualquier clase o tamaño de nave de salvamento\n     - Un rayo tractor de mano\n\n> Descargo de responsabilidad <\nLos contratistas son responsables de garantizar que recogen materiales de vehiculos considerados salvamento legitimo conforme a las leyes vigentes de la UEE. Adagio Holdings no sera responsable de ningun delito o falta cometido por los contratistas y no ofrecera compensacion ni reparacion a ninguna persona afectada por estas acciones.\n\n<EM4>Reputation Awarded:</EM4> 100\n\n<EM4>Posibles planos</EM4>\n<EM4>Otorgado en variantes de nivel Contratista junior</EM4>\n- Trawler Scraper Module (Modulo de salvamento)\n- Abrade Scraper Module (Modulo de salvamento)\n- Cinch Scraper Module (Modulo de salvamento)\n
